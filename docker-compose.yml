services:
  pms-backend:
    build: .
    container_name: pms-backend
    restart: unless-stopped
    ports:
      - "7000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      AUTH_COOKIE_SECURE: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
